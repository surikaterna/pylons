<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pylons local validation</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><h1>Pylons local validation</h1><p>Browser preview runs downloaded providers locally. The server independently authorizes and validates submitted documents.</p>
<form id="validation-form"><label for="tenant">Tenant</label><select id="tenant" name="tenant"><option value="a">Tenant A</option><option value="b">Tenant B</option></select>
<label for="session">Session</label><select id="session" name="session"><option value="alice">Alice</option><option value="bob">Bob</option></select>
<label for="title">Title</label><input id="title" name="title" autocomplete="off">
<label for="reference">Reference</label><input id="reference" name="reference" autocomplete="off">
<button type="submit">Validate locally</button><button id="load-fixture" type="button">Load long document fixture</button><button id="refresh" type="button">Refresh metadata</button><button id="shutdown" type="button">Shut down</button></form>
<p id="status" role="status" aria-live="polite">Loading metadata</p><h2>Lifecycle and revisions</h2><pre id="lifecycle" aria-label="Lifecycle and revisions"></pre></main><script src="/host/browser.js"></script></body></html>
